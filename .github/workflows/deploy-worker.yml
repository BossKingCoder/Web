name: Deploy Site-Lock Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/site-lock-worker.js'
      - 'wrangler.jsonc'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy workers/site-lock-worker.js --config wrangler.jsonc --name site-lock
          postCommands: |
            echo "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET --name site-lock --config wrangler.jsonc
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
